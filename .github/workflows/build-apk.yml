name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check - verify real app code is present
        run: |
          echo "== calisma dizini =="
          pwd
          ls -la
          echo "== lib/main.dart ilk 10 satiri =="
          head -10 lib/main.dart
          grep -q "KelimeHafizaApp" lib/main.dart || (echo "!!! HATA: lib/main.dart beklenen Kelime Hafiza kodunu icermiyor, yanlis dosya yuklenmis olabilir." && exit 1)
          echo "OK: dogru proje kodu bulundu."

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate missing platform folders (android only, without touching app code)
        run: |
          if [ ! -d "android" ]; then
            TMP_SCAFFOLD=$(mktemp -d)
            flutter create --platforms=android --org com.kelimehafiza --project-name kelime_hafiza "$TMP_SCAFFOLD/scaffold"
            cp -r "$TMP_SCAFFOLD/scaffold/android" ./android
            rm -rf "$TMP_SCAFFOLD"
            echo "android/ klasoru gecici scaffold'dan kopyalandi, lib/ ve pubspec.yaml dokunulmadi."
          fi

      - name: Opt out of AGP 9 new DSL (Flutter compatibility fix, see flutter/flutter#175688)
        run: |
          echo "" >> android/gradle.properties
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties
          echo "--- gradle.properties icerigi ---"
          cat android/gradle.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Add AdMob test App ID to AndroidManifest.xml
        run: |
          python3 << 'PYEOF'
          import re
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          content = open(manifest_path, encoding='utf-8').read()
          print("--- ONCESI ---")
          print(content)

          if 'android.permission.INTERNET' not in content:
              m = re.search(r'<manifest\b[^>]*>', content)
              content = content[:m.end()] + '\n    <uses-permission android:name="android.permission.INTERNET"/>' + content[m.end():]

          if 'com.google.android.gms.ads.APPLICATION_ID' not in content:
              m = re.search(r'<application\b[^>]*>', content)
              meta = '\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>'
              content = content[:m.end()] + meta + content[m.end():]

          open(manifest_path, 'w', encoding='utf-8').write(content)
          print("--- SONRASI ---")
          print(content)
          PYEOF
          echo "--- XML gecerlilik kontrolu ---"
          python3 -c "
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          print('GECERLI XML')
          "

      - name: Generate app icon from logo
        run: |
          dart run flutter_launcher_icons
          echo "--- uretilen ikon dosyalari ---"
          find android/app/src/main/res -iname "ic_launcher*"

      - name: Disable release minification (ProGuard/R8 - AdMob ile crash yapabiliyor)
        run: |
          python3 << 'PYEOF'
          import re
          for path in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              try:
                  content = open(path).read()
              except FileNotFoundError:
                  continue
              print(f"--- {path} oncesi ---")
              print(content)
              if 'isMinifyEnabled' in content or 'minifyEnabled' in content:
                  print("Zaten bir minify ayari var, dokunulmadi.")
                  continue
              m = re.search(r'release\s*\{', content)
              if m:
                  is_kts = path.endswith('.kts')
                  if is_kts:
                      addition = '\n            isMinifyEnabled = false\n            isShrinkResources = false'
                  else:
                      addition = '\n            minifyEnabled false\n            shrinkResources false'
                  content = content[:m.end()] + addition + content[m.end():]
                  open(path, 'w').write(content)
                  print(f"--- {path} sonrasi ---")
                  print(content)
          PYEOF

      - name: Set up release signing (Play Store icin gercek imza)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret bos - imzalama atlaniyor, debug imzasiyla devam edilecek."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-key.jks\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

          python3 << 'PYEOF'
          import re
          path = "android/app/build.gradle.kts"
          content = open(path, encoding='utf-8').read()

          header = ("import java.util.Properties\n"
                     "import java.io.FileInputStream\n\n"
                     "val keystorePropertiesFile = rootProject.file(\"key.properties\")\n"
                     "val keystoreProperties = Properties()\n"
                     "if (keystorePropertiesFile.exists()) {\n"
                     "    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n"
                     "}\n\n")
          if 'keystoreProperties' not in content:
              content = header + content

          if 'create("release")' not in content:
              m = re.search(r'android\s*\{', content)
              signing_block = ('\n    signingConfigs {\n'
                                '        create("release") {\n'
                                '            keyAlias = keystoreProperties["keyAlias"] as String?\n'
                                '            keyPassword = keystoreProperties["keyPassword"] as String?\n'
                                '            storeFile = keystoreProperties["storeFile"]?.let { file(it) }\n'
                                '            storePassword = keystoreProperties["storePassword"] as String?\n'
                                '        }\n    }\n')
              content = content[:m.end()] + signing_block + content[m.end():]

          content = content.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          open(path, 'w', encoding='utf-8').write(content)
          print("--- build.gradle.kts (imzalama sonrasi) ---")
          print(content)
          PYEOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle (Play Store icin)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelime-hafiza-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: kelime-hafiza-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
